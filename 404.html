<link rel="stylesheet" href="/style.css">
<script>
// Old Cargo links (e.g. /GLUE, /VCM-v1) were case-insensitive. Send them to the new page.
var pages = ["pal", "glue", "bertrand-piccard", "vcm", "waterblock", "bathtub", "cargoshell", "about"];
var aliases = {"vcm-v1": "vcm", "waterblock-v1": "waterblock", "the-bathtub": "bathtub"};
var slug = location.pathname.replace(/^\/+|\/+$/g, "").replace(/\/index\.html$/i, "").toLowerCase();
slug = aliases[slug] || slug;
if (pages.indexOf(slug) >= 0) location.replace("/" + slug + "/");
</script>
